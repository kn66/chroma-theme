name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  emacs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["30.1", "30.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}
      - run: make verify

  external-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.2"
      - run: make bootstrap-external
      - run: make test-external
